<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="headerDocente" class="docente-topbar">

    <div></div>

    <div class="docente-user-area">

        <div class="docente-notification" aria-label="Notificaciones">
            <span class="nav-icon icon-bell"></span>
            <i></i>
        </div>

        <div class="docente-user">

            <div class="docente-user__text">
                <strong
                        th:if="${session.usuario != null}"
                        th:text="${session.usuario.nombres + ' ' + session.usuario.apellidos}">
                    Usuario
                </strong>

                <strong th:if="${session.usuario == null}">Docente</strong>
                <small>Docente</small>
            </div>

            <div class="docente-avatar">
                <span th:text="${session.usuario != null ? #strings.substring(session.usuario.nombres, 0, 1) : 'D'}">D</span>
                <i></i>
            </div>

        </div>

    </div>

</header>

</body>
</html>
