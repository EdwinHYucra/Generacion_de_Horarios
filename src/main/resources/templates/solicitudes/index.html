<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Cambio</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/solicitudes_admin.css}">
</head>
<body>

<div class="app">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="content content--solicitudes">
            <section class="page-title">
                <h1>Solicitudes de Cambio</h1>
                <p>Atiende observaciones y rechazos enviados por docentes.</p>
            </section>

            <div th:if="${mensajeExito}" class="alert alert--success">
                <span th:text="${mensajeExito}"></span>
            </div>

            <section class="panel">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Codigo</th>
                            <th>Docente</th>
                            <th>Horario</th>
                            <th>Tipo</th>
                            <th>Comentario docente</th>
                            <th>Estado</th>
                            <th>Respuesta</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="solicitud : ${solicitudes}" class="solicitud-admin-row"
                            th:attr="data-docente=${solicitud.docente},data-codigo=${solicitud.codigoSolicitud},data-tipo=${solicitud.tipoSolicitud},data-estado=${solicitud.estadoSolicitud}">
                            <td th:text="${solicitud.codigoSolicitud}">SOL</td>
                            <td th:text="${solicitud.docente}">Docente</td>
                            <td th:text="${'Opcion ' + solicitud.opcionHorario}">Opcion</td>
                            <td th:text="${solicitud.tipoSolicitud}">Tipo</td>
                            <td th:text="${solicitud.comentarioDocente}">Comentario</td>
                            <td th:text="${solicitud.estadoSolicitud}">PENDIENTE</td>
                            <td>
                                <form th:if="${solicitud.estadoSolicitud == 'PENDIENTE'}"
                                      th:action="@{/administrador/solicitudes/tomar}"
                                      method="post"
                                      class="form-group">
                                    <input type="hidden" name="idSolicitud" th:value="${solicitud.idSolicitud}">
                                    <div class="action-group">
                                        <button type="submit" class="btn btn--secondary">
                                            Tomar
                                        </button>
                                    </div>
                                </form>
                                <div th:if="${solicitud.estadoSolicitud == 'EN_REVISION'}" class="action-group">
                                    <a class="btn btn--secondary"
                                       th:href="@{/administrador/horarios/editar/{id}(id=${solicitud.idHorario},solicitud=${solicitud.idSolicitud})}">
                                        Editar horario
                                    </a>
                                </div>
                                <form th:if="${solicitud.estadoSolicitud == 'PENDIENTE' or solicitud.estadoSolicitud == 'EN_REVISION'}"
                                      th:action="@{/administrador/solicitudes/responder}"
                                      method="post"
                                      class="form-group"
                                      onsubmit="return this.comentarioAdministrador.value.trim().length > 0;">
                                    <input type="hidden" name="idSolicitud" th:value="${solicitud.idSolicitud}">
                                    <textarea name="comentarioAdministrador"
                                              rows="3"
                                              class="form-control"
                                              placeholder="Comentario obligatorio"></textarea>
                                    <div class="action-group">
                                        <button type="submit" name="estado" value="APROBADA" class="btn btn--primary">
                                            Aprobar
                                        </button>
                                        <button type="submit" name="estado" value="RECHAZADA" class="btn btn--secondary">
                                            Rechazar
                                        </button>
                                    </div>
                                </form>
                                <span th:unless="${solicitud.estadoSolicitud == 'PENDIENTE' or solicitud.estadoSolicitud == 'EN_REVISION'}"
                                      th:text="${solicitud.comentarioAdministrador ?: '-'}">-</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(solicitudes)}">
                            <td colspan="7" class="empty-table">Aun no hay solicitudes registradas.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
