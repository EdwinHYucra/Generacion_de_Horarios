<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cursos</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="app">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

        <div th:replace="~{fragments/header :: header}"></div>

        <main class="content content--courses">

            <section class="module-heading">
                <div>
                    <h1>Gestión de Cursos</h1>
                    <p>Administre el catálogo de cursos, sus horas semanales y tipo académico.</p>
                </div>
            </section>

            <div th:if="${mensajeExito}" class="alert alert--success">
                <span th:text="${mensajeExito}"></span>
            </div>

            <div th:if="${mensajeError}" class="alert alert--error">
                <span th:text="${mensajeError}"></span>
            </div>

            <section class="module-toolbar">
                <div class="module-search">
                    <img th:src="@{/assets/IMG_11.svg}" alt="Buscar">
                    <input id="inputBuscarCurso"
                           type="text"
                           placeholder="Buscar cursos por nombre o código...">
                </div>

                <button type="button" class="btn btn--secondary">
                    Buscar
                </button>

                <button type="button" class="btn btn--primary" onclick="abrirModal('cursoModal')">
                    <span class="btn__icon">+</span>
                    <span>Agregar Curso</span>
                </button>

                <a th:href="@{/administrador/cursos}" class="btn btn--secondary">
                    Cancelar
                </a>
            </section>

            <section class="module-table-card">

                <div class="table-wrapper">
                    <table class="module-table">
                        <thead>
                        <tr>
                            <th>Código</th>
                            <th>Curso</th>
                            <th>Horas</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="item : ${cursos}"
                            class="curso-row"
                            th:attr="data-codigo=${item.codigo},
                                     data-nombre=${item.nombre},
                                     data-tipo=${item.tipo}">

                            <td>
                                <strong th:text="${item.codigo}">CUR001</strong>
                            </td>

                            <td th:text="${item.nombre}">
                                Base de Datos I
                            </td>

                            <td th:text="${item.horasSemanales}">
                                4
                            </td>

                            <td>
                                <span class="badge badge--muted" th:text="${item.tipo}">
                                    TEORICO
                                </span>
                            </td>

                            <td>
                                <span class="status-pill status-pill--active">Activo</span>
                            </td>

                            <td>
                                <div class="action-group">
                                    <a th:href="@{/administrador/cursos/editar/{id}(id=${item.idCurso})}"
                                       class="action-link"
                                       title="Editar">
                                        <img th:src="@{/assets/IMG_16.svg}" alt="Editar">
                                    </a>

                                    <form th:action="@{/administrador/cursos/eliminar/{id}(id=${item.idCurso})}"
                                          method="post"
                                          class="inline-form"
                                          onsubmit="return confirm('¿Seguro que deseas desactivar este curso?');">
                                        <button type="submit"
                                                class="action-button"
                                                title="Desactivar">
                                            <img th:src="@{/assets/IMG_17.svg}" alt="Desactivar">
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(cursos)}">
                            <td colspan="6" class="empty-table">
                                No hay cursos registrados.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="module-table-footer">
                    <p>
                        Mostrando
                        <strong id="cantidadCursos" th:text="${#lists.size(cursos)}">0</strong>
                        cursos registrados
                    </p>

                    <div class="pagination">
                        <button type="button" disabled>‹</button>
                        <button type="button" class="is-active">1</button>
                        <button type="button" disabled>›</button>
                    </div>
                </div>

            </section>

        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>

</div>

<div id="cursoModal"
     class="modal"
     th:classappend="${modoEdicion} ? ' modal--show' : ''"
     aria-hidden="true">

    <div class="modal__backdrop" onclick="cerrarModal('cursoModal')"></div>

    <div class="course-modal">

        <form th:action="@{/administrador/cursos/guardar}" th:object="${curso}" method="post">

            <div class="course-modal__header">
                <h2 th:text="${modoEdicion} ? 'Editar Curso' : 'Agregar Nuevo Curso'">
                    Agregar Nuevo Curso
                </h2>

                <button type="button"
                        class="course-modal__close"
                        onclick="cerrarModal('cursoModal')">
                    &times;
                </button>
            </div>

            <div class="course-modal__body">

                <input type="hidden" th:field="*{idCurso}">
                <input type="hidden" th:field="*{estado}">

                <div class="course-form-grid">

                    <div class="form-group">
                        <label>Nombre del curso<span class="required">*</span></label>
                        <input type="text"
                               th:field="*{nombre}"
                               required
                               maxlength="150"
                               class="form-control"
                               placeholder="p. ej. Base de Datos I">
                    </div>

                    <div class="form-group">
                        <label>Código del curso<span class="required">*</span></label>
                        <input type="text"
                               th:field="*{codigo}"
                               required
                               maxlength="30"
                               class="form-control"
                               placeholder="Código del curso">
                    </div>

                    <div class="form-group">
                        <label>Horas semanales<span class="required">*</span></label>
                        <input type="number"
                               th:field="*{horasSemanales}"
                               required
                               min="1"
                               max="12"
                               class="form-control"
                               placeholder="Ej. 4">
                    </div>

                    <div class="form-group">
                        <label>Tipo<span class="required">*</span></label>
                        <select th:field="*{tipo}" required class="form-control">
                            <option value="">Seleccione</option>
                            <option value="TEORICO">Teórico</option>
                            <option value="PRACTICO">Práctico</option>
                            <option value="LABORATORIO">Laboratorio</option>
                        </select>
                    </div>

                </div>

            </div>

            <div class="course-modal__footer">
                <button type="submit" class="btn btn--primary">
                    Guardar
                </button>

                <a th:href="@{/administrador/cursos}" class="btn btn--secondary">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
