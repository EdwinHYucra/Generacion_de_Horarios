<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluacion Docente</title>
    <link rel="stylesheet" th:href="@{/css/evaluacion_docente.css}">
</head>
<body>

<main class="survey-page">
    <section class="survey-hero">
        <div class="survey-brand">
            <span>UTP</span>
            <strong>Encuesta academica</strong>
        </div>
        <div>
            <h1>Evaluacion docente</h1>
            <p>Califica el desempeno del docente por curso dictado en el ciclo anterior.</p>
        </div>
    </section>

    <section class="survey-panel">
        <div th:if="${mensajeExito}" class="alert alert--success" th:text="${mensajeExito}"></div>
        <div th:if="${mensajeError}" class="alert alert--error" th:text="${mensajeError}"></div>

        <form th:action="@{/evaluacion-docente}" th:object="${evaluacion}" method="post" class="survey-form">
            <input type="hidden" th:field="*{idDocente}" id="idDocente">
            <input type="hidden" th:field="*{idCurso}" id="idCurso">

            <label class="field">
                <span>Docente y curso</span>
                <select id="opcionEvaluacion" required>
                    <option value="">Seleccione una opcion</option>
                    <option th:each="opcion : ${opciones}"
                            th:value="${opcion.idDocente + '-' + opcion.idCurso}"
                            th:attr="data-docente=${opcion.idDocente}, data-curso=${opcion.idCurso}"
                            th:text="${opcion.nombreDocente + ' - ' + opcion.nombreCurso + ' (' + opcion.cicloAcademico + ')'}">
                        Docente - Curso
                    </option>
                </select>
            </label>

            <div class="score-section">
                <div class="score-section__header">
                    <span>Puntaje</span>
                    <div id="categoriaPreview" class="category-preview">Seleccione un puntaje</div>
                </div>

                <input id="puntajeInput" type="hidden" th:field="*{puntaje}" required>

                <div class="score-options" role="radiogroup" aria-label="Puntaje de evaluacion">
                    <label th:each="valor : ${#numbers.sequence(0, 10)}"
                           class="score-option"
                           th:classappend="${evaluacion.puntaje != null and evaluacion.puntaje == valor} ? ' is-selected' : ''">
                        <input type="radio"
                               name="puntajeRadio"
                               th:value="${valor}"
                               th:checked="${evaluacion.puntaje != null and evaluacion.puntaje == valor}"
                               required>
                        <span th:text="${valor}">0</span>
                    </label>
                </div>
            </div>

            <div class="score-scale" aria-label="Escala de calificacion">
                <span class="score-scale__bad"><strong>0-6</strong> Malo</span>
                <span class="score-scale__neutral"><strong>7-8</strong> Neutral</span>
                <span class="score-scale__good"><strong>9-10</strong> Positivo</span>
            </div>

            <label class="field">
                <span>Comentario</span>
                <textarea th:field="*{comentario}" maxlength="500"
                          placeholder="Comentario opcional sobre la experiencia academica"></textarea>
            </label>

            <button type="submit" class="submit-button" th:disabled="${#lists.isEmpty(opciones)}">
                Enviar evaluacion
            </button>

            <p th:if="${#lists.isEmpty(opciones)}" class="empty-state">
                No hay docentes del ciclo anterior disponibles para evaluar.
            </p>
        </form>
    </section>
</main>

<script th:src="@{/js/evaluacion_docente.js}"></script>
</body>
</html>
