<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Generador de Horarios Automático UTP</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      transition: all 0.2s ease;
    }

    body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #1e293b;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: "Plus Jakarta Sans", "Poppins", ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.10),
                  0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .input-focus-ring:focus-within {
      box-shadow: 0 0 0 2px rgba(213, 0, 0, 0.12);
      border-color: #D50000;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body class="bg-[#F4F4F6] min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="h-16 bg-[#F4F4F6] border-b border-[#E1E1E5] flex items-center justify-between px-6 lg:px-12 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-[#D50000] rounded-md flex items-center justify-center">
        <img src="/assets/IMG_1.svg" alt="Logo UTP" class="w-5 h-5">
      </div>

      <h1 class="text-[#D50000] font-bold text-lg lg:text-xl tracking-tight">
        Generador de Horarios Automático UTP
      </h1>
    </div>

    <button type="button" class="text-sm font-medium text-[#111111] hover:text-[#D50000]">
      Ayuda
    </button>
  </header>

  <!-- MAIN -->
  <main class="flex-grow flex flex-col lg:flex-row overflow-hidden">

    <!-- IMAGEN IZQUIERDA -->
    <section class="hidden lg:block lg:w-1/2 relative bg-[#F8FAFC] border-r border-[#E1E1E5] overflow-hidden">
      <div class="absolute inset-0 flex items-center justify-center">

        <!-- 
          IMPORTANTE:
          Si tu imagen se llama IMG_2.png, usa esta ruta.
          Si en tu carpeta assets tienes IMG_2.svg, cambia IMG_2.png por IMG_2.svg.
        -->
        <img
          src="/assets/IMG_2.png"
          alt="Ilustración UTP"
          class="w-full h-full object-cover object-center scale-110"
        >

      </div>
    </section>

    <!-- FORMULARIO LOGIN -->
    <section class="w-full lg:w-1/2 flex items-center justify-center p-6 lg:p-12">
      <div class="glass-card w-full max-w-[420px] rounded-lg p-8 lg:p-10">

        <!-- CABECERA FORMULARIO -->
        <div class="flex flex-col items-center text-center mb-8">
          <div class="w-16 h-16 bg-[#D50000]/10 rounded-full flex items-center justify-center mb-6">
            <img src="/assets/IMG_1.svg" alt="Icono" class="w-8 h-8">
          </div>

          <h2 class="text-2xl font-bold text-[#111111] mb-2">
            Iniciar Sesión
          </h2>

          <p class="text-sm text-[#95959D] leading-relaxed">
            Ingresa tus credenciales institucionales para acceder al sistema.
          </p>
        </div>

        <!-- FORM CORREGIDO PARA SPRING SECURITY -->
        <form class="space-y-5" method="post" action="/login">

          <!-- CORREO / USERNAME -->
          <div class="space-y-2">
            <label for="username" class="block text-sm font-medium text-[#111111]">
              Correo
            </label>

            <div class="relative input-focus-ring border border-[#E1E1E5] rounded-md bg-white">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <img src="/assets/IMG_3.svg" alt="Usuario" class="w-5 h-5 opacity-60">
              </div>

              <input
                type="text"
                id="username"
                name="username"
                placeholder="admin@utp.edu.pe"
                class="block w-full pl-10 pr-3 py-2.5 text-sm text-[#111111] placeholder-[#95959D] bg-transparent border-none focus:ring-0 outline-none"
                required
              >
            </div>
          </div>

          <!-- CONTRASEÑA -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-[#111111]">
              Contraseña
            </label>

            <div class="relative input-focus-ring border border-[#E1E1E5] rounded-md bg-white">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <img src="/assets/IMG_5.svg" alt="Contraseña" class="w-5 h-5 opacity-60">
              </div>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                class="block w-full pl-10 pr-3 py-2.5 text-sm text-[#111111] placeholder-[#95959D] bg-transparent border-none focus:ring-0 outline-none"
                required
              >
            </div>
          </div>

          <!-- BOTÓN -->
          <button
            type="submit"
            class="w-full bg-[#D50000] hover:bg-[#b30000] text-white font-semibold py-3 rounded-md shadow-sm transition-colors mt-4"
          >
            Ingresar al Sistema
          </button>

        </form>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="h-12 bg-[#F4F4F6] border-t border-[#E1E1E5] flex items-center justify-center px-4">
    <p class="text-[10px] md:text-xs text-[#95959D] text-center">
      © 2026 Generador de Horarios Automático UTP - Universidad Tecnológica. Todos los derechos reservados.
    </p>
  </footer>

</body>
</html>
