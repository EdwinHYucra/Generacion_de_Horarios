<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Administrador</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="superadmin-app">
    <div th:replace="~{fragments/sidebar_superadmin :: sidebarSuperadmin}"></div>

    <div class="superadmin-main">
        <header class="superadmin-topbar">
            <div class="superadmin-user">
                <div>
                    <strong>Hola, SuperAdmin</strong><br>
                    <span>Super administrador</span>
                </div>
                <div class="superadmin-avatar"></div>
            </div>
        </header>

        <main class="superadmin-content">
            <section class="superadmin-title">
                <h1>Registrar Administrador</h1>
                <p>Crea una cuenta con permisos para operar los modulos academicos.</p>
            </section>

            <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>

            <section class="superadmin-form-card">
                <form th:action="@{/superadmin/admins/guardar}"
                      th:object="${adminDTO}"
                      method="post">

                    <div class="campo">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" placeholder="Nombre">
                        <span class="error-msg" th:if="${#fields.hasErrors('nombre')}"
                              th:errors="*{nombre}"></span>
                    </div>

                    <div class="campo">
                        <label>Apellido</label>
                        <input type="text" th:field="*{apellido}" placeholder="Apellido">
                        <span class="error-msg" th:if="${#fields.hasErrors('apellido')}"
                              th:errors="*{apellido}"></span>
                    </div>

                    <div class="campo">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" placeholder="admin@utp.edu.pe">
                        <span class="error-msg" th:if="${#fields.hasErrors('email')}"
                              th:errors="*{email}"></span>
                    </div>

                    <div class="campo">
                        <label>Contrasena</label>
                        <input type="password" th:field="*{password}" placeholder="********">
                        <span class="error-msg" th:if="${#fields.hasErrors('password')}"
                              th:errors="*{password}"></span>
                    </div>

                    <div class="form-botones">
                        <a th:href="@{/superadmin/admins}" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">Registrar</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="superadmin-footer">
            © 2026 Generador de Horarios Automatico UTP - Universidad Tecnologica.
        </footer>
    </div>
</div>

</body>
</html>
