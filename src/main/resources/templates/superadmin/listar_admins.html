<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administradores | UTP</title>
    <link rel="stylesheet" th:href="@{/css/listar_admins.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">
        <div class="logo-utp">UTP</div>
        <span class="navbar-titulo">Generador de Horarios</span>
    </div>
    <div class="navbar-links">
        <a th:href="@{/superadmin/dashboard}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            Dashboard
        </a>
        <a th:href="@{/superadmin/admins}" class="nav-link activo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Administradores
        </a>
        <a th:href="@{/logout}" class="nav-link nav-logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Cerrar sesión
        </a>
    </div>
</nav>

<div class="contenido">

    <div class="contenido-header">
        <div>
            <h1>Administradores</h1>
            <p class="subtitulo">Gestiona los administradores registrados en el sistema.</p>
        </div>
        <a th:href="@{/superadmin/admins/nuevo}" class="btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo Admin
        </a>
    </div>

    <div th:if="${exito}" class="alerta alerta-exito" th:text="${exito}"></div>

    <div class="tabla-card">
        <table class="tabla">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Correo institucional</th>
                    <th>Estado</th>
                    <th class="th-acciones">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="admin : ${admins}">
                    <td class="celda-id" th:text="${admin.id}"></td>
                    <td th:text="${admin.nombre}"></td>
                    <td th:text="${admin.apellido}"></td>
                    <td class="celda-email" th:text="${admin.email}"></td>
                    <td>
                        <span th:class="${admin.estado == 'ACTIVO'} ? 'badge badge-activo' : 'badge badge-inactivo'"
                              th:text="${admin.estado}"></span>
                    </td>
                    <td class="acciones">
                        <a th:href="@{/superadmin/admins/editar/{id}(id=${admin.id})}"
                           class="btn-secondary btn-sm">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            Editar
                        </a>
                        <a th:if="${admin.estado == 'ACTIVO'}"
                           th:href="@{/superadmin/admins/desactivar/{id}(id=${admin.id})}"
                           class="btn-danger btn-sm"
                           onclick="return confirm('¿Desactivar este administrador?')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                            Desactivar
                        </a>
                        <a th:if="${admin.estado == 'INACTIVO'}"
                           th:href="@{/superadmin/admins/activar/{id}(id=${admin.id})}"
                           class="btn-success btn-sm"
                           onclick="return confirm('¿Activar este administrador?')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                            Activar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(admins)}">
                    <td colspan="6" class="tabla-vacia">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        No hay administradores registrados
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
