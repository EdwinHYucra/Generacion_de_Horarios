<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesion</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="login-page">

<header class="login-topbar">
    <div class="login-brand">
        <span class="login-brand__mark"><i data-lucide="graduation-cap"></i></span>
        <strong>Generador de Horarios Automatico UTP</strong>
    </div>
    <a href="#" class="login-help">Ayuda</a>
</header>

<main class="login-shell">
    <section class="login-visual" aria-label="Ilustracion institucional">
        <img class="login-visual__image"
             th:src="@{/img/login/IMG_2.png}"
             alt="Docente UTP presentando el sistema de horarios">
    </section>

    <section class="login-panel">
        <div class="login-card login-card--prototype">
            <div class="login-card__icon"><i data-lucide="graduation-cap"></i></div>
            <h1>Iniciar Sesion</h1>
            <p>Ingresa tus credenciales institucionales para acceder.</p>

            <div th:if="${param.error}" class="alerta alerta-error">
                Credenciales incorrectas.
            </div>
            <div th:if="${param.logout}" class="alerta alerta-info">
                Sesion cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post" class="login-form">
                <div class="login-field">
                    <label for="username">Correo institucional</label>
                    <div class="login-input">
                        <span><i data-lucide="user"></i></span>
                        <input type="email" id="username" name="username"
                               placeholder="admin@sistema.com" required>
                    </div>
                </div>

                <div class="login-field">
                    <label for="password">Contrasena</label>
                    <div class="login-input">
                        <span><i data-lucide="lock"></i></span>
                        <input type="password" id="password" name="password"
                               placeholder="********" required>
                    </div>
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox" name="remember-me">
                        <span>Recordarme</span>
                    </label>
                    <a href="#">Olvidaste tu contrasena?</a>
                </div>

                <button type="submit" class="login-submit">Ingresar al Sistema</button>
            </form>
        </div>
    </section>
</main>

<footer class="login-footer">
    <p>© 2026 Generador de Horarios Automatico UTP - Universidad Tecnologica. Todos los derechos reservados.</p>
</footer>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
    if (window.lucide) {
        window.lucide.createIcons();
    }
</script>
</body>
</html>
