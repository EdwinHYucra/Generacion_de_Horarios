spring.application.name=generador_horario

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/generador_horario?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.jdbc.repositories.enabled=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

logging.level.org.springframework.jdbc=DEBUG
logging.level.pe.edu.utp=DEBUG
