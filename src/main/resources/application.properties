# ============================================================
#  application.properties — Generador de Horarios UTP
#  Base de datos: MySQL via XAMPP
# ============================================================

# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=generador-horarios

# ── MySQL (XAMPP) ────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/generador_horarios?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# update  → crea/actualiza tablas automáticamente (desarrollo)
# validate → solo valida, no toca las tablas (producción)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
